; ---------------------------------------------------------------------------
; Portail captif de configuration Wi-Fi — ESP32-S3
;
; A placer a la RACINE du projet (a cote des dossiers src/ et include/).
; ---------------------------------------------------------------------------

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Decode les stack traces en cas de crash : indispensable des qu'on touche
; au reseau, sinon on ne recupere qu'une liste d'adresses hexadecimales.
monitor_filters = esp32_exception_decoder, time

; Necessaire si tu flashes par le port USB natif du S3 (/dev/ttyACM0).
; Sur le port UART (/dev/ttyUSB0) ces deux lignes sont inutiles mais inoffensives.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Aucun lib_deps : WiFi, WebServer, DNSServer et Preferences sont tous
; fournis par le framework Arduino-ESP32. Rien a telecharger.